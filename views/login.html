<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ProGestão — Login</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0e0b1e;--surface:#16112e;--card:#1e1840;--card2:#251f4a;--border:#2e2750;--purple:#7c3aed;--purple-mid:#8b5cf6;--purple-light:#a78bfa;--glow:rgba(124,58,237,.25);--text1:#f0ecff;--text2:#b8b0d8;--text3:#7a708f;--danger:#ef4444;--font:'Inter','Segoe UI',system-ui,sans-serif}
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
body{font-family:var(--font);background:var(--bg);color:var(--text1);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-wrap{width:100%;max-width:420px}
.login-card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:0 12px 48px rgba(0,0,0,.6)}
.login-header{padding:40px 32px 24px;text-align:center;background:var(--card2);border-bottom:1px solid var(--border)}
.login-icon{width:72px;height:72px;background:linear-gradient(135deg,var(--purple),var(--purple-mid));border-radius:20px;display:inline-flex;align-items:center;justify-content:center;font-size:36px;margin-bottom:16px;box-shadow:0 0 40px var(--glow)}
.login-title{font-size:24px;font-weight:800;letter-spacing:-.8px;margin-bottom:4px}
.login-sub{font-size:13px;color:var(--text3)}
.login-body{padding:32px}
.form-group{margin-bottom:18px}
.form-label{display:block;font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.form-control{width:100%;padding:12px 16px;border:1.5px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text1);font-size:15px;font-family:var(--font);transition:all .2s}
.form-control:focus{outline:none;border-color:var(--purple-mid);box-shadow:0 0 0 3px var(--glow)}
.form-control::placeholder{color:var(--text3)}
.btn-login{width:100%;padding:14px;background:linear-gradient(135deg,var(--purple),var(--purple-mid));color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;font-family:var(--font);cursor:pointer;transition:all .2s;box-shadow:0 4px 16px var(--glow)}
.btn-login:hover{transform:translateY(-2px);box-shadow:0 6px 24px var(--glow)}
.btn-login:active{transform:translateY(0)}
.btn-login:disabled{opacity:.5;cursor:not-allowed;transform:none}
.error-msg{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:var(--danger);padding:10px 14px;border-radius:8px;font-size:13px;font-weight:600;margin-bottom:16px;display:none;text-align:center}
.error-msg.show{display:block}
.login-footer{text-align:center;padding:0 32px 24px;font-size:11px;color:var(--text3)}
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-header">
      <div class="login-icon">🏭</div>
      <h1 class="login-title">ProGestão</h1>
      <p class="login-sub">Sistema de Gestão — Montagem</p>
    </div>
    <div class="login-body">
      <div class="error-msg" id="error"></div>
      <form id="loginForm" onsubmit="doLogin(event)">
        <div class="form-group">
          <label class="form-label">Usuário</label>
          <input type="text" class="form-control" id="username" placeholder="Digite seu usuário" required autofocus>
        </div>
        <div class="form-group">
          <label class="form-label">Senha</label>
          <input type="password" class="form-control" id="password" placeholder="Digite sua senha" required>
        </div>
        <button type="submit" class="btn-login" id="btnLogin">🔑 Entrar</button>
      </form>
    </div>
    <div class="login-footer">© 2026 ProGestão — Setor de Montagem</div>
  </div>
</div>
<script>
async function doLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('btnLogin');
  const errEl = document.getElementById('error');
  btn.disabled = true;
  btn.textContent = 'Entrando...';
  errEl.classList.remove('show');

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      })
    });
    const data = await res.json();
    if (data.success) {
      window.location.href = '/';
    } else {
      errEl.textContent = data.error || 'Erro ao fazer login';
      errEl.classList.add('show');
    }
  } catch (err) {
    errEl.textContent = 'Erro de conexão com o servidor';
    errEl.classList.add('show');
  }
  btn.disabled = false;
  btn.textContent = '🔑 Entrar';
}
</script>
</body>
</html>
