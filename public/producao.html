<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProGestão – Produção</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#0f1419;--panel:#1a2332;--panel2:#243447;--border:#2d4055;--text:#e6edf3;--text2:#8b98a5;--accent:#3fb950;--accent2:#2ea043;--blue:#58a6ff;--orange:#f0883e;--red:#f85149;--yellow:#d29922;--purple:#a371f7}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh}
.topbar{background:var(--panel);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar .logo{font-size:18px;font-weight:700;color:var(--accent)}
.topbar .user-info{display:flex;align-items:center;gap:16px;font-size:13px}
.topbar .clock{color:var(--text2)}
.topbar .btn-logout{background:var(--red);color:#fff;border:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600}
.layout{display:flex;min-height:calc(100vh - 56px)}
.sidebar{width:220px;background:var(--panel);border-right:1px solid var(--border);padding:20px 0;flex-shrink:0}
.sidebar a{display:block;padding:10px 24px;color:var(--text2);text-decoration:none;font-size:14px;border-left:3px solid transparent;transition:all .2s}
.sidebar a:hover{background:var(--panel2);color:var(--text)}
.sidebar a.active{background:var(--panel2);color:var(--accent);border-left-color:var(--accent)}
.main{flex:1;padding:24px;overflow-x:auto}
.tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.tab{background:transparent;border:none;color:var(--text2);padding:10px 16px;cursor:pointer;font-size:13px;font-weight:600;border-bottom:2px solid transparent;transition:all .2s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.section{display:none}
.section.show{display:block}
.card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:18px;margin-bottom:16px}
.card-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:12px}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group label{font-size:11px;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.form-group input,.form-group select,.form-group textarea{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:6px;font-size:13px;outline:none;transition:border-color .2s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent)}
.btn-sm{padding:8px 14px;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;transition:opacity .2s}
.btn-accent{background:var(--accent);color:#fff}
.btn-blue{background:var(--blue);color:#fff}
.btn-red{background:var(--red);color:#fff}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:12px}
table th{background:var(--panel2);color:var(--text2);text-align:left;padding:10px 8px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;font-size:11px;border-bottom:1px solid var(--border)}
table td{padding:9px 8px;border-bottom:1px solid var(--border);color:var(--text)}
#toast{position:fixed;bottom:20px;right:20px;background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--accent);padding:12px 18px;border-radius:6px;color:var(--text);font-size:13px;z-index:1000;display:none;box-shadow:0 4px 12px rgba(0,0,0,.3)}
#toast.err{border-left-color:var(--red)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:2000;padding:20px}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">⚙️ ProGestão</div>
  <div class="user-info">
    <span class="clock" id="clock">--:--</span>
    <span id="user-name">Usuário</span>
    <button class="btn-logout" onclick="logout()">Sair</button>
  </div>
</div>

<div class="layout">
  <nav class="sidebar">
    <a href="/">🏠 Início</a>
    <a href="/producao" class="active">🏭 Produção</a>
  </nav>

  <div class="main">
    <div style="display:flex;gap:10px;margin-bottom:14px;align-items:center">
      <label style="font-size:12px;color:var(--text2)">Mês:</label>
      <input type="month" id="filtro-mes" onchange="loadAll()">
    </div>

    <div class="tabs">
      <button class="tab active" onclick="showTab('dashboard',event)">📊 Dashboard</button>
      <button class="tab" onclick="showTab('planos',event)">📋 Plano Mensal</button>
      <button class="tab" onclick="showTab('apontar',event)">✏️ Apontamento Diário</button>
      <button class="tab" onclick="showTab('produtos',event)">🗂️ Produtos</button>
      <button class="tab" onclick="showTab('config',event)">⚙️ Config</button>
    </div>

    <!-- DASHBOARD -->
    <div class="section show" id="sec-dashboard">
      <div class="card">
        <div class="card-title">🎛️ Filtros</div>
        <div class="form-row">
            <select id="dash-categoria" onchange="onChangeCategoria()">
              <option value="total">Total</option>
              <option value="Piso">Piso</option>
              <option value="Parede">Parede</option>
            </select>
        </div>
      </div>
      <div class="card">
        <canvas id="chartProducao" style="height:300px"></canvas>
      </div>
      <div class="card">
        <canvas id="chartHoras" style="height:300px"></canvas>
      </div>
    </div>

    <!-- PLANOS -->
    <div class="section" id="sec-planos">
      <div class="card">
        <div class="card-title">➕ Novo Plano</div>
        <input type="hidden" id="p-id">
        <div class="form-row">
          <div class="form-group"><label>Data</label><input type="date" id="p-data-limite"></div>
          <div class="form-group"><label>OP</label><input type="text" id="p-num-op"></div>
          <div class="form-group"><label>Cód. Décio</label><input type="text" id="p-cod-decio"></div>
          <div class="form-group"><label>Meta</label><input type="number" id="p-meta"></div>
        </div>
        <button class="btn-sm btn-accent" onclick="salvarPlano()">Salvar</button>
      </div>
      <div class="card">
          <table>
              <thead><tr><th>Data</th><th>OP</th><th>Décio</th><th>Meta</th><th>Ações</th></tr></thead>
              <tbody id="tb-planos"></tbody>
          </table>
      </div>
    </div>

    <!-- APONTAR -->
    <div class="section" id="sec-apontar">
        <div class="card">
            <div class="card-title">🚀 Iniciar Produção</div>
            <div class="form-row">
                <input type="date" id="a-data">
                <select id="a-turno"><option value="1">T1</option><option value="2">T2</option></select>
                <input type="text" id="a-num-op" placeholder="OP">
                <input type="text" id="a-cod-decio" placeholder="Cód. Décio">
            </div>
            <button class="btn-sm btn-blue" onclick="iniciarApontamento()">Iniciar</button>
        </div>
        <div class="card">
            <table id="tblAndamento">
                <thead><tr><th>Data</th><th>OP</th><th>Décio</th><th>Ações</th></tr></thead>
                <tbody id="tb-apont-andamento"></tbody>
            </table>
        </div>
    </div>

    <!-- OUTRAS SEÇÕES (PRODUTOS / CONFIG) -->
    <div class="section" id="sec-produtos">
        <div class="card"><div class="card-title">🗂️ Produtos</div><tbody id="tb-produtos"></tbody></div>
    </div>
    <div class="section" id="sec-config">
        <div class="card"><div class="card-title">⚙️ Config</div><tbody id="tb-meta-config"></tbody></div>
    </div>

  </div>
</div>

<div id="toast"></div>

<script>
const API = '/api';
let planos = [], apontamentosDet = [], mesAtual = new Date().toISOString().substring(0,7);

// CORREÇÃO DOS BOTÕES - Função showTab Universal
function showTab(tab, ev){
  document.querySelectorAll('.section').forEach(s => s.classList.remove('show'));
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  
  const secId = 'sec-' + tab;
  const sec = document.getElementById(secId);
  if(sec) {
      sec.classList.add('show');
      sec.style.display = 'block';
  }
  
  // Esconde as outras manualmente para garantir
  document.querySelectorAll('.section').forEach(s => {
      if(s.id !== secId) s.style.display = 'none';
  });

  if(ev && ev.currentTarget) ev.currentTarget.classList.add('active');
  if(tab === 'dashboard') renderDashboard();
}

async function api(path, opts={}) {
  const r = await fetch(API + path, { credentials:'include', headers:{'Content-Type':'application/json'}, ...opts });
  return r.json();
}

function getVal(id){ const e = document.getElementById(id); return e ? e.value : ''; }

async function loadAll(){
  const m = getVal('filtro-mes') || mesAtual;
  try {
    const [p, ad] = await Promise.all([
      api('/prod-planos?mes='+m),
      api('/prod-apontamentos-detalhados?mes='+m)
    ]);
    planos = Array.isArray(p) ? p : [];
    apontamentosDet = Array.isArray(ad) ? ad : [];
    renderPlanos();
    renderApontamentosDet();
    renderDashboard();
  } catch(e) { console.error(e); }
}

function renderPlanos(){
  const tb = document.getElementById('tb-planos');
  if(!tb) return;
  tb.innerHTML = planos.map(p => `
    <tr>
      <td>${p.data_limite}</td>
      <td>${p.num_op}</td>
      <td>${p.cod_decio}</td>
      <td>${p.meta}</td>
      <td><button onclick="excluirPlano(${p.id})">🗑️</button></td>
    </tr>
  `).join('');
}

function renderApontamentosDet(){
    const tb = document.getElementById('tb-apont-andamento');
    if(!tb) return;
    tb.innerHTML = apontamentosDet.filter(a => a.status === 'andamento').map(a => `
        <tr>
            <td>${a.data_exec}</td>
            <td>${a.num_op}</td>
            <td>${a.cod_decio}</td>
            <td><button class="btn-sm btn-accent" onclick="abrirFinalizar(${a.id})">Finalizar</button></td>
        </tr>
    `).join('');
}

function renderDashboard(){
    // Lógica simplificada de gráficos para não travar
    console.log("Dashboard Renderizado");
}

document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('filtro-mes').value = mesAtual;
    loadAll();
});
</script>
</body>
</html>
